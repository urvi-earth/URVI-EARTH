<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URVI | Page Under Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="index/index.css">
    <style>
        body { background: #F8FAFC; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .construction-card {
            background: #ffffff; border-radius: 28px; padding: 48px 36px; text-align: center;
            max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.06); border: 1.5px solid rgba(34, 197, 94, 0.2);
        }
        .construction-icon-wrapper {
            width: 100px; height: 100px; background: #F0FDF4; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 48px;
            margin: 0 auto 24px; animation: bounceIcon 2s infinite ease-in-out;
        }
        @keyframes bounceIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .btn-home {
            background: linear-gradient(135deg, #14532D, #22C55E); color: #fff;
            padding: 12px 28px; border-radius: 50px; font-weight: 600; text-decoration: none;
            display: inline-block; transition: all 0.2s ease; border: none;
        }
        .btn-home:hover { opacity: 0.95; transform: translateY(-2px); color: #fff; }
    </style>
</head>
<body>
    <div class="construction-card">
        <div class="construction-icon-wrapper">🚧</div>
        <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill fw-bold mb-3">WORKSPACE IN PROGRESS</span>
        <h2 class="fw-bold text-dark mb-2">Page Under Construction</h2>
        <p class="text-muted mb-4" style="font-size:14px; line-height:1.6;">
            We are working hard to nurture and bring this green feature to life. Please check back soon or return to the main dashboard.
        </p>
        <a href="index.html" class="btn-home"><i class="bi bi-house-door-fill me-2"></i> Return to Homepage</a>
    </div>
</body>
</html>
