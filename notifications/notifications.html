<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../components/dark-mode.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URVI | Notifications Center</title>
    <meta name="description" content="URVI Notifications Center - Stay updated with likes, comments, and new followers.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="apple-touch-icon" href="../assets/logo.png">
    <meta name="theme-color" content="#22C55E">

    <!-- Main Theme & Notifications CSS -->
    <link rel="stylesheet" href="../index/index.css">
    <link rel="stylesheet" href="notifications.css">
    <link rel="stylesheet" href="../components/translator.css">
</head>

<body>

<div class="app-wrapper">

    <!-- ==========================
            Desktop Sidebar
    =========================== -->
    <aside class="desktop-sidebar d-none d-lg-flex flex-column">
        <div class="d-flex align-items-center mb-5">
            <img src="../assets/logo.png" class="brand-logo-img me-2" alt="URVI Logo" style="width: 44px; height: 44px; max-width: 44px; max-height: 44px; object-fit: contain; flex-shrink: 0;" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
            <span class="brand-icon" style="display:none;">🌿</span>
            <div>
                <h4 class="m-0 fw-bold" style="color:var(--forest-green);">URVI</h4>
                <div class="logo-text">Connect • Care • Conserve</div>
            </div>
        </div>

        <nav class="sidebar-nav flex-grow-1">
            <a href="../index.html" class="sidebar-link">
                <i class="bi bi-house-fill"></i> Home
            </a>
            <a href="../activities/activities.html" class="sidebar-link">
                <i class="bi bi-bar-chart-line-fill"></i> Activities
            </a>
            <a href="../impact/impact.html" class="sidebar-link">
                <i class="bi bi-bullseye"></i> Impact
            </a>
            <a href="../community/community.html" class="sidebar-link">
                <i class="bi bi-people-fill"></i> Community
            </a>
            <a href="../profile/profile.html" class="sidebar-link">
                <i class="bi bi-person-circle"></i> Profile
            </a>
            <a href="../profile/mycertificates.html" class="sidebar-link ps-4" style="font-size:13px; color:#16A34A;">
                <i class="bi bi-award-fill"></i> My Certificates
            </a>
            <a href="../profile/my-virtual-tree.html" class="sidebar-link ps-4" style="font-size:13px; color:#16A34A;">
                <i class="bi bi-tree-fill"></i> My Virtual Tree
            </a>
            <a href="notifications.html" class="sidebar-link active">
                <i class="bi bi-bell-fill"></i> Notifications
            </a>
            <a href="#" class="sidebar-link" onclick="if(window.openUrviSupportModal) window.openUrviSupportModal(); return false;">
                <i class="bi bi-headset"></i> Help & Support
            </a>
            <a href="#" class="sidebar-link pwa-install-btn" id="nav-install-app" style="color:var(--bright-green);">
                <i class="bi bi-download"></i> Install App
            </a>
        </nav>
    </aside>

    <!-- ==========================
            Main Notifications Content
    =========================== -->
    <main class="notifications-container">
        
        <!-- Header Bar -->
        <div class="notif-page-header">
            <div class="notif-header-top">
                <div class="notif-header-title-group">
                    <span class="notif-header-icon">🔔</span>
                    <div>
                        <h2 class="notif-page-title">Notifications Center</h2>
                        <p class="notif-page-subtitle">Track likes, comments, and new eco connections</p>
                    </div>
                </div>
                <button id="btn-mark-all-read" class="btn-mark-all">
                    <i class="bi bi-check2-all"></i> Mark all read
                </button>
            </div>

            <!-- Filter Tabs -->
            <div class="notif-tabs">
                <button class="notif-tab active" data-filter="all">All</button>
                <button class="notif-tab" data-filter="like">Likes ❤️</button>
                <button class="notif-tab" data-filter="comment">Comments 💬</button>
                <button class="notif-tab" data-filter="follow">Follows 👤</button>
            </div>
        </div>

        <!-- Notifications List Container -->
        <div class="notif-full-list" id="notif-full-list">
            <div class="text-center py-5">
                <div class="spinner-border text-success"></div>
                <p class="mt-2 text-muted">Loading your notifications...</p>
            </div>
        </div>

    </main>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Global Components -->
<script type="module" src="../components/theme-toggle.js"></script>
<script type="module" src="../components/drawer.js"></script>
<script type="module" src="../components/support-modal.js"></script>
<script type="module" src="../components/translator.js"></script>
<script type="module" src="notifications.js"></script>

</body>
</html>
